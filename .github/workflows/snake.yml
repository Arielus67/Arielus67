name: Serpiente de commits

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#5B21B6&color_dots=#EDE9FE,#C4B5FD,#A78BFA,#8B5CF6,#5B21B6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#A855F7&color_dots=#151526,#30234A,#5B21B6,#8B5CF6,#C4B5FD

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
