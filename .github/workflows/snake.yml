name: Serpiente de commits

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#ff2e97&color_dots=#0d0221,#3a0ca3,#7b2ff7,#b5179e,#00f0ff
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00f0ff&color_dots=#161b22,#3a0ca3,#7b2ff7,#ff2e97,#00f0ff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
